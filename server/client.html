<!DOCTYPE html>
<html>
<head>
    <title>Building Management System</title>
    <style>
        body { font-family: monospace; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        #log { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        .user { color: #0066cc; }
        .agent { color: #006600; }
        .system { color: #999; }
        .tool { color: #cc6600; font-size: 0.9em; }
        input { width: 80%; padding: 8px; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
    <h2>Building Management System</h2>
    <div id="log"></div>
    <input id="input" type="text" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>

    <script>
        const log = document.getElementById("log");
        const input = document.getElementById("input");
        const ws = new WebSocket("ws://localhost:8765");

        function appendLog(text, cls) {
            const div = document.createElement("div");
            div.className = cls;
            div.textContent = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        ws.onopen = () => appendLog("Connected to server.", "system");
        ws.onclose = () => appendLog("Disconnected from server.", "system");

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "system") {
                appendLog(data.message, "system");
            } else if (data.type === "response") {
                appendLog("Agent: " + data.message, "agent");
                if (data.tool_calls.length > 0) {
                    data.tool_calls.forEach((call, i) => {
                        appendLog(
                            `  [${i+1}] ${call.tool}(${JSON.stringify(call.args)})`,
                            "tool"
                        );
                    });
                }
            }
        };

        function sendMessage() {
            const msg = input.value.trim();
            if (!msg || ws.readyState !== WebSocket.OPEN) return;
            appendLog("You: " + msg, "user");
            ws.send(JSON.stringify({ message: msg }));
            input.value = "";
        }

        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
